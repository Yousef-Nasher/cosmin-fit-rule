[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosminfit"
version = "0.1.0"
description = "Rate confirmatory factor analysis fit against the COSMIN criterion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Yousef M. Nasher", email = "yousefnasher76@gmail.com"}, {name = "Marwan Alqumbaey"}, {name = "Fareed AL-Mekhlafi"}, {name = "Suhaib Nasr"}, {name = "Hael Saeed Hassan Ali"}, {name = "Abdulaleem Badi"}, {name = "Zaid Al-hayas"}, {name = "Ammar AL-Hadidah", email = "ammar5mohammads5@gmail.com"}]
keywords = ["COSMIN", "CFA", "fit indices", "structural validity", "psychometrics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Yousef-Nasher/cosmin-fit-rule"

[project.optional-dependencies]
pandas = ["pandas"]

[tool.setuptools]
packages = ["cosminfit"]

[tool.setuptools.package-data]
cosminfit = ["py.typed"]
